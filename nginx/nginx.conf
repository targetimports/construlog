server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Vídeos do Centro de Ajuda. Arquivos grandes: cache longo e sem log de acesso.
    # O nginx já responde Range requests, o que permite arrastar a barra do player.
    location /videos/ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # Cache de assets com hash do Vite
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Proxy reverso para o backend (Express). O backend monta as rotas na raiz
    # (/auth, /entities, /functions, /integrations, /files), então removemos o
    # prefixo /api/ ao repassar.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA fallback — nunca cachear o index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
}
