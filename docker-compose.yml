name: construlog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - construlog_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_NOME: ${SEED_ADMIN_NOME}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA}
      # Dados de exemplo — false em instalação de cliente (ver backend/src/seed.js).
      SEED_DEMO: ${SEED_DEMO:-false}
      UPLOAD_DIR: /data/uploads
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Licenciamento: vazio = instalação livre, sem reportar nada.
      BACKOFFICE_URL: ${BACKOFFICE_URL:-}
      BACKOFFICE_API_KEY: ${BACKOFFICE_API_KEY:-}
      # Gateway de pagamento (só no painel do fornecedor).
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_AMBIENTE: ${ASAAS_AMBIENTE:-sandbox}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - uploads:/data/uploads
      - ./logs:/data/logs
    networks:
      - construlog_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Vídeos do Centro de Ajuda: ficam FORA da imagem (230 MB) e são servidos
      # direto pelo nginx. Assim trocar um vídeo não exige rebuild do frontend.
      - ./videos:/usr/share/nginx/html/videos:ro
    networks:
      - construlog_net

volumes:
  dbdata:
  uploads:

networks:
  construlog_net:
    driver: bridge
